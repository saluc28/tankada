services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tankada}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tankada}
      POSTGRES_DB: ${POSTGRES_DB:-tankada}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tankada"]
      interval: 5s
      timeout: 5s
      retries: 5

  analyzer:
    build:
      context: ../analyzer
    environment:
      - PYTHONUNBUFFERED=1
      - SCHEMA_CONFIG_PATH=/policies/schema.json
    volumes:
      - ../policies:/policies:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  opa:
    image: openpolicyagent/opa:1.16.1
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=info"
      # --watch reloads /policies when files change. Without it, OPA loads the
      # bundle once at boot and ignores swaps of schema.json / templates.json
      # while the gateway hot-reloads them (B.1.c), so the two diverge silently.
      - "--watch"
      - "/policies"
    volumes:
      - ../policies:/policies:ro

  proxy:
    build:
      context: ../proxy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tankada}:${POSTGRES_PASSWORD:-tankada}@postgres:5432/${POSTGRES_DB:-tankada}?sslmode=disable
      PORT: "8082"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    build:
      context: ../gateway
    environment:
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      # C.1.a: asymmetric JWT verification (RS256/JWKS). If either of these is
      # set the gateway switches to RS256 mode and JWT_SECRET is ignored.
      JWT_JWKS_URL: ${JWT_JWKS_URL:-}
      JWT_JWKS_PATH: ${JWT_JWKS_PATH:-}
      JWT_JWKS_REFRESH_SEC: ${JWT_JWKS_REFRESH_SEC:-300}
      # C.1.b: per-tenant key isolation. When true, every JWK MUST carry
      # tankada_tenant; untagged kids reject the token. Default false for
      # backward-compat with C.1.a JWKS (untagged kids accept any tenant_id
      # with a warning).
      JWT_JWKS_REQUIRE_TENANT_BINDING: ${JWT_JWKS_REQUIRE_TENANT_BINDING:-false}
      # C.2.b: opt-in telemetry. Empty URL disables; setting it sends a
      # periodic heartbeat of version + aggregate counters (no PII/SQL).
      TANKADA_TELEMETRY_URL: ${TANKADA_TELEMETRY_URL:-}
      TANKADA_TELEMETRY_TOKEN: ${TANKADA_TELEMETRY_TOKEN:-}
      TANKADA_TELEMETRY_INTERVAL_SEC: ${TANKADA_TELEMETRY_INTERVAL_SEC:-3600}
      TANKADA_TELEMETRY_DRY_RUN: ${TANKADA_TELEMETRY_DRY_RUN:-false}
      TANKADA_SITE_ID: ${TANKADA_SITE_ID:-}
      TANKADA_ENV: ${TANKADA_ENV:-development}
      ANALYZER_URL: "http://analyzer:8001"
      OPA_URL: "http://opa:8181"
      PROXY_URL: "http://proxy:8082"
      SCHEMA_CONFIG_PATH: "/policies/schema.json"
      # D.4.a: tamper-evident audit chain. The path points to the file where
      # the gateway persists the chain's tail hash so the chain survives
      # restart. Mounted as a named volume below; unset to disable persistence
      # (chain still works but restarts at every boot).
      AUDIT_CHAIN_STATE_PATH: "/var/lib/tankada/audit_chain.state"
    volumes:
      - ../policies:/policies:ro
      - audit_chain_state:/var/lib/tankada
    ports:
      - "8080:8080"
    depends_on:
      analyzer:
        condition: service_healthy
      opa:
        condition: service_started
      proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Postgres wire-protocol front-end: point a stock Postgres driver here
  # (connection string only) and every statement is enforced like the HTTP
  # gateway. Identity is the Tankada JWT, supplied as the connection password.
  pgwire:
    build:
      context: ../gateway
      dockerfile: Dockerfile.pgwire
    environment:
      PGWIRE_ADDR: ":5433"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      # C.1.a: asymmetric JWT verification (RS256/JWKS). If either of these is
      # set the pgwire switches to RS256 mode and JWT_SECRET is ignored.
      JWT_JWKS_URL: ${JWT_JWKS_URL:-}
      JWT_JWKS_PATH: ${JWT_JWKS_PATH:-}
      JWT_JWKS_REFRESH_SEC: ${JWT_JWKS_REFRESH_SEC:-300}
      # C.1.b: per-tenant key isolation (see gateway service above).
      JWT_JWKS_REQUIRE_TENANT_BINDING: ${JWT_JWKS_REQUIRE_TENANT_BINDING:-false}
      ANALYZER_URL: "http://analyzer:8001"
      OPA_URL: "http://opa:8181"
      DATABASE_URL: postgres://${POSTGRES_USER:-tankada}:${POSTGRES_PASSWORD:-tankada}@postgres:5432/${POSTGRES_DB:-tankada}?sslmode=disable
      PGWIRE_APP_ROLE: "tankada_app"
      SCHEMA_CONFIG_PATH: "/policies/schema.json"
    volumes:
      - ../policies:/policies:ro
    ports:
      - "5433:5433"
    depends_on:
      analyzer:
        condition: service_healthy
      opa:
        condition: service_started
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  # D.4.a: persists the audit chain tail hash so tamper-evidence survives
  # `docker compose down` + `up`. Each gateway boot reads the file at start
  # and resumes from the recorded hash; if the volume is wiped the next boot
  # starts a fresh chain from GenesisHash (the verifier surfaces the cut).
  audit_chain_state:
